# Configuração de Proxy Reverso para Apache
# Arquivo: /www/server/panel/vhost/apache/proxy/adornoshmm.d36.com.br/api-proxy.conf

<IfModule mod_proxy.c>
    # Habilitar proxy
    ProxyPreserveHost On
    ProxyRequests Off
    
    # Proxy para API Backend (Node.js na porta 4001)
    ProxyPass /api http://localhost:4001/api
    ProxyPassReverse /api http://localhost:4001/api
    
    # Timeout para requisições longas
    ProxyTimeout 300
    
    # Headers para WebSocket e conexões persistentes
    <Location /api>
        ProxyPass http://localhost:4001/api
        ProxyPassReverse http://localhost:4001/api
        
        # Headers necessários
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    </Location>
</IfModule>
