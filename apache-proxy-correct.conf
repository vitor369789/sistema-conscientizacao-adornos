#PROXY-START/
<IfModule mod_proxy.c>
    ProxyRequests Off
    SSLProxyEngine on
    ProxyPreserveHost On
    
    # IMPORTANTE: A ordem importa! API primeiro, depois frontend
    
    # 1. Proxy para API Backend (porta 4001) - DEVE VIR PRIMEIRO
    ProxyPass /api http://localhost:4001/api
    ProxyPassReverse /api http://localhost:4001/api
    
    # 2. Proxy para Vite Dev Server (porta 4000) - DEPOIS
    ProxyPass / http://localhost:4000/
    ProxyPassReverse / http://localhost:4000/
    
    # WebSocket para HMR do Vite (hot reload)
    <IfModule mod_rewrite.c>
        RewriteEngine on
        RewriteCond %{HTTP:Upgrade} websocket [NC]
        RewriteCond %{HTTP:Connection} upgrade [NC]
        RewriteRule ^/?(.*) "ws://localhost:4000/$1" [P,L]
    </IfModule>
    
    # Timeout para requisições
    ProxyTimeout 300
</IfModule>
#PROXY-END/
